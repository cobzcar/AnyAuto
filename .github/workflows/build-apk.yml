name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # build.sh wants build-tools 35.0.0 and the android-35 platform in $ANDROID_HOME
      - name: Install the Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Optional: a fixed signing key, so each new APK installs over the previous one.
      # Without the secret, build.sh makes a new key on every run.
      - name: Use the signing key from the repository secrets, if any
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keys
            echo "$KEYSTORE_BASE64" | base64 -d > keys/anyauto.keystore
          fi

      - name: Build the APK
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AnyAuto-apk
          path: anyauto.apk
